name: Publish Windows release

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "app-v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: yarn install --frozen-lockfile

      # Fork releases use the local unsigned configuration. The application
      # checks GitHub's asset digest before starting the Windows installer.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=4096"
        with:
          includeUpdaterJson: false
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "Download the Windows installer or portable archive from the assets below."
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.local.conf.json --target x86_64-pc-windows-msvc

      - name: Test and publish portable archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --test .github/workflows/windows-portable/portable-archive.node-test.mjs
          node .github/workflows/windows-portable/portable.mjs x86_64-pc-windows-msvc
